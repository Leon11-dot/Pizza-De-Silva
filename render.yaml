services:
  - type: web
    runtime: static
    name: pizza-de-silva
    buildCommand: echo "No build required"
    staticPublishPath: .
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
